# SPDX-License-Identifier: Apache-2.0
# The fleet's secret scan, called from gates at @main like every other repository in the fleet,
# so a new gitleaks version or a repinned .gitleaks.toml or .githooks/pre-push digest reaches
# this repository with no edit here. Treadling inlined a copy of it until 2026-09-17, because the
# shared workflow then lived in automation, which is private, and GitHub refuses a public
# repository's call into a private one with zero jobs (run 34200497703). gates is public, so that
# reason is gone, and the inlined copy had stopped following the canonical pins.
#
# The check this reports is `secrets / secret scan`, the caller's job id before the called job's
# name, and .github/rulesets/main.json requires it by that name. Renaming `secrets` below renames
# the required context, and a required context nothing reports blocks every merge.
name: secret scan

on:
  push:
    branches: [main]
  pull_request:
  # What changes between runs is gitleaks' rule set, not this repository's history.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secrets:
    uses: Abhijeet34/gates/.github/workflows/shared-secret-scan.yml@main
